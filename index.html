<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Vegetarian Protein Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}
header{background:#17202a;color:#fff;padding:20px;text-align:center}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;opacity:.8}
.container{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:600;font-size:14px}
input,select,button{width:100%;padding:11px;margin-top:6px;border-radius:9px;border:1px solid #d5d8dc;font-size:15px}
button{background:#17202a;color:#fff;border:none;cursor:pointer;font-weight:600}button.secondary{background:#eaecee;color:#17202a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f2f4f4;border-radius:10px;padding:12px;text-align:center}.stat strong{display:block;font-size:22px}
.progress{height:12px;background:#e5e7e9;border-radius:20px;overflow:hidden;margin-top:10px}.progress-bar{height:100%;width:0%;background:#27ae60;transition:width .3s}
.meals{display:grid;gap:12px}.meal{border:1px solid #e5e7e9;border-radius:12px;padding:14px}.meal h3{margin:0 0 6px}
.meta{font-size:14px;color:#566573;margin-bottom:8px}.ingredients{font-size:14px;line-height:1.5;color:#34495e}
.badge{display:inline-block;background:#eafaf1;color:#196f3d;padding:4px 8px;border-radius:20px;font-size:12px;margin-right:5px}
.skip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.skip-item{padding:8px;background:#f8f9f9;border-radius:8px}.skip-item label{font-weight:normal}
@media(max-width:600px){.controls,.stats{grid-template-columns:1fr}.skip-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Indian Vegetarian Protein Planner</h1><p>High-protein vegetarian meals for everyday Indian eating</p></header>
<div class="container">
<div class="card"><h2>Your Targets</h2><div class="controls">
<div><label>Daily Protein Target (g)</label><input id="proteinTarget" type="number" value="150"></div>
<div><label>Daily Calories Target</label><input id="calorieTarget" type="number" value="2200"></div>
</div></div>
<div class="card"><h2>Daily Progress</h2><div class="stats">
<div class="stat"><strong id="totalProtein">0</strong>Protein g</div>
<div class="stat"><strong id="totalCalories">0</strong>Calories</div>
<div class="stat"><strong id="mealCount">0</strong>Meals</div>
</div><div class="progress"><div class="progress-bar" id="proteinProgress"></div></div></div>
<div class="card"><h2>Search Meals</h2><div class="controls">
<div><label>Search</label><input id="search" placeholder="Paneer, dal, dosa, chilla..."></div>
<div><label>Category</label><select id="category"><option>All</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select></div>
</div></div>
<div class="card"><h2>Foods to Skip</h2><div class="skip-grid" id="skipList"></div></div>
<div class="card"><h2>Meal Library</h2><div id="mealList" class="meals"></div></div>
</div>

const SKIP_FOODS=["paneer","tofu","soy","soya","curd","greek yogurt","milk","wheat","roti","rice","dal","rajma","chole","chana","peanuts","seeds","besan","sattu"];
let selectedMeals=[],skippedFoods=new Set();

function renderSkipList(){
 const c=document.getElementById("skipList"); c.innerHTML="";
 SKIP_FOODS.forEach(food=>{
  const d=document.createElement("div");d.className="skip-item";
  d.innerHTML=`<label><input type="checkbox" value="${food}"> ${food}</label>`;
  d.querySelector("input").addEventListener("change",e=>{
   e.target.checked?skippedFoods.add(food):skippedFoods.delete(food); renderMeals();
  });
  c.appendChild(d);
 });
}
function mealShouldBeSkipped(meal){
 const text=(meal[0]+" "+meal[4]).toLowerCase();
 return [...skippedFoods].some(f=>text.includes(f));
}
function addMeal(i){selectedMeals.push(MEALS[i]);updateStats();}
function updateStats(){
 let p=0,c=0;selectedMeals.forEach(m=>{p+=m[2];c+=m[3]});
 document.getElementById("totalProtein").textContent=p;
 document.getElementById("totalCalories").textContent=c;
 document.getElementById("mealCount").textContent=selectedMeals.length;
 const target=Number(document.getElementById("proteinTarget").value)||1;
 document.getElementById("proteinProgress").style.width=Math.min(p/target*100,100)+"%";
}
function renderMeals(){
 const c=document.getElementById("mealList");c.innerHTML="";
 const search=document.getElementById("search").value.toLowerCase();
 const category=document.getElementById("category").value;
 MEALS.forEach((m,i)=>{
  if(mealShouldBeSkipped(m))return;
  if(category!=="All"&&m[1]!==category)return;
  if(search&&!(`${m[0]} ${m[4]}`.toLowerCase().includes(search)))return;
  const d=document.createElement("div");d.className="meal";
  d.innerHTML=`<h3>${m[0]}</h3>
  <div class="meta"><span class="badge">${m[1]}</span><span class="badge">${m[2]} g protein</span><span class="badge">${m[3]} kcal</span></div>
  <div class="ingredients">${m[4]}</div><br><button onclick="addMeal(${i})">Add to My Day</button>`;
  c.appendChild(d);
 });
}
document.getElementById("search").addEventListener("input",renderMeals);
document.getElementById("category").addEventListener("change",renderMeals);
document.getElementById("proteinTarget").addEventListener("input",updateStats);
document.getElementById("calorieTarget").addEventListener("input",updateStats);
renderSkipList();renderMeals();updateStats();
</script>
</body>
</html>
